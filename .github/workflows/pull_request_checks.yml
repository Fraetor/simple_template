name: Pull request checks

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-ver: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.py-ver }}

      - name: Install test dependencies and build package
        run: |
          python3 -m pip install -r requirements.txt
          python3 -m pip install .

      - name: Run tests
        env:
          PY_COLORS: "1"
          PY_VERSION: ${{ matrix.py-ver }}
        run: |
          pytest --verbose --cov --cov-append --cov-config=pyproject.toml
          mv .coverage ".coverage.${PY_VERSION}"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.py-ver }}
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true

  coverage-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install coverage
        run: python3 -m pip install coverage

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Generate complete coverage report
        run: coverage combine

      - name: Check 95% minimum coverage
        run: coverage report --fail-under=95
