name: Pull request checks

on:
  pull_request:
  push:
    branches:
      - "main"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        py-ver: ["py311", "py312", "py313", "py314"]
    steps:
      - uses: actions/checkout@v6

      - name: Install test dependencies
        run: python3 -m pip install -r requirements.txt

      - name: Run tests
        env:
          PY_COLORS: "1"
        run: |
          python3 -m pip install .
          pytest --verbose --cov --cov-append --cov-config=pyproject.toml
          mv .coverage ".coverage.${{ matrix.py-ver }}"

      - uses: actions/upload-artifact@v7
        with:
          name: coverage-data-${{ matrix.py-ver }}
          path: .coverage.*
          retention-days: 1
          include-hidden-files: true

  coverage-report:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: tests
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install coverage
        run: python3 -m pip install coverage

      - uses: actions/download-artifact@v8
        with:
          pattern: coverage-data-*
          merge-multiple: true

      - name: Generate complete coverage report
        run: coverage combine

      - name: Check 95% minimum coverage
        run: coverage report --fail-under=95
